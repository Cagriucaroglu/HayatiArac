# Aşama A (WSL prova): SSL'siz, sade sürüm. Domain yok, server_name "_" (catch-all).
# Aşama B'de (gerçek VPS + domain) certbot bu dosyayı otomatik güncelleyip
# SSL bloklarını (listen 443 ssl, ssl_certificate, ...) ekleyecek.

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
